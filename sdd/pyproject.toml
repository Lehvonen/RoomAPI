[project]
name = "roomapi-sdd"
version = "0.1.0"
description = "Room booking API built with Specification-Driven Development (Spec Kit)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "tzdata>=2024.2",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
